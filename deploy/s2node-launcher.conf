# Opt-in s2node.service drop-in. Provision exact release baseline first.
# Keep /usr/local/libexec/s2node-launcher root-owned; copy verified s2node there.
[Service]
Type=notify
NotifyAccess=main
ExecStart=
ExecStart=/usr/local/libexec/s2node-launcher project-launch --config /etc/s2node/node.json
RestartForceExitStatus=75
RestartPreventExitStatus=78
TimeoutStartSec=700
TimeoutStopSec=45
KillMode=control-group
