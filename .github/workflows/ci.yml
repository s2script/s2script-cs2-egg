name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# nothing here writes anything back to the repository
permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # the daemon runs one goroutine per container plus the samplers; a
      # race here is a production bug, not a test flake
      - run: go test -race ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./...
      # a known CVE in a dependency is a build failure, not a thing to
      # notice later: x/net shipped 12 of them behind the docker client
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/KitsuneLab-Dockerfile
          platforms: linux/amd64
          load: true
          tags: s2script-cs2-egg:ci
      - run: docker run --rm s2script-cs2-egg:ci /usr/local/bin/cs2egg version
