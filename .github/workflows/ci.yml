# SPDX-License-Identifier: GPL-3.0-or-later
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false # stdlib-only module has no go.sum
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: make build egg-check
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal tests)"
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [runtime, debug]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build from source without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          tags: s2script-cs2-egg:ci-${{ matrix.target }}
          load: true
          push: false
      - name: Check non-root configuration and immutable bootstrap (no game download)
        env:
          IMAGE: s2script-cs2-egg:ci-${{ matrix.target }}
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE" -ec '
            test "$(id -u)" -ne 0
            test "$HOME" = /home/container
            test -w "$HOME"
            test -x /usr/bin/env
            test -x /bin/bash
            test -e /lib/ld-linux.so.2
            for f in steamcmd.sh linux32/steamcmd linux32/steamerrorreporter linux32/libstdc++.so.6 linux32/crashhandler.so; do
              test -s "/opt/s2egg/steamcmd/$f"
              test ! -w "/opt/s2egg/steamcmd/$f"
            done
            test -r /usr/local/share/licenses/s2egg/Go-LICENSE
            ALLOW_TOKENLESS=1 s2egg config check --root /home/container
          '
          if [ "$TARGET" = debug ]; then
            docker run --rm --entrypoint /bin/sh "$IMAGE" -ec 'command -v gdbserver; command -v gdb'
          fi
